name: Publish External Dists

# One-shot workflow: uploads any pre-built wheel/sdist staged under
# dist-external/ to PyPI using the existing HANZO_PYPI_TOKEN / PYPI_TOKEN
# repo secret. Used to bootstrap external deps (zap-mdns, zap-protocol)
# whose source lives outside this repo.

on:
  workflow_dispatch:

jobs:
  upload:
    name: Upload dist-external/* to PyPI
    runs-on: hanzo-build-linux-amd64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install twine
        run: pip install --upgrade twine

      - name: List dists
        run: ls -la dist-external/

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.HANZO_PYPI_TOKEN || secrets.PYPI_TOKEN }}
        run: |
          python -m twine upload --skip-existing dist-external/*.whl dist-external/*.tar.gz
