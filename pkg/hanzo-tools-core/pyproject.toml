[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hanzo-tools-core"
version = "0.3.1"
description = "DEPRECATED: Use hanzo-tools instead. Empty compatibility shim that installs hanzo-tools."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Hanzo Industries Inc", email = "dev@hanzo.ai" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
keywords = ["hanzo", "tools", "mcp", "ai"]
# Pure metapackage: ships no modules, only pulls in canonical hanzo-tools.
# It used to bundle a duplicate hanzo_tools/core/ that SHADOWED hanzo-tools
# (nondeterministic collision → missing symbols like ToolImage). Canonical
# hanzo-tools now owns hanzo_tools.core exclusively; this just redirects.
dependencies = [
    "hanzo-tools>=0.3.2",
]

[project.urls]
"Homepage" = "https://github.com/hanzoai/python-sdk"
"Bug Tracker" = "https://github.com/hanzoai/python-sdk/issues"

[tool.setuptools]
# Empty shim — no importable packages or modules of its own.
py-modules = []
