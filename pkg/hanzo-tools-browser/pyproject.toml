[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hanzo-tools-browser"
version = "0.5.13"
description = "Browser automation tools: drive the user's own browser through the Hanzo extension, over the ZAP router every ZAP process embeds."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Hanzo Industries Inc", email = "dev@hanzo.ai" }]
keywords = ["hanzo", "tools", "browser", "playwright", "mcp", "ai", "automation", "extension"]
dependencies = [
    "hanzo-tools>=0.3.6",  # 0.3.6 carries capture(): downscaled inline, full-res on disk
    "mcp>=1.25.0",
    # capture() downscales with PIL; without it a screenshot is a path and no pixels.
    "pillow>=10.0.0",
    "pydantic>=2.12.5",
    # The ZAP router, embedded: the lock elects one process per user login,
    # and this one takes a seat on it. The one implementation; never ported.
    "zapd>=1.1.3",
]

[project.optional-dependencies]
playwright = [
    "playwright>=1.49.0",
]

[project.scripts]
hanzo-zap-host = "hanzo_tools.browser.native_host:main"

[project.entry-points."hanzo.tools"]
browser = "hanzo_tools.browser:TOOLS"

[tool.setuptools.packages.find]
where = ["."]
include = ["hanzo_tools*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]
