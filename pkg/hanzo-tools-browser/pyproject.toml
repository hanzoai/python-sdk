[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hanzo-tools-browser"
version = "0.5.6"
description = "Browser automation tools with ZAP-native extension routing — Python MCP hosts the ZAP server on an OS-assigned port and advertises via mDNS (HIP-0069). No node bridge, no port pool, no lockfile."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Hanzo Industries Inc", email = "dev@hanzo.ai" }]
keywords = ["hanzo", "tools", "browser", "playwright", "mcp", "ai", "automation", "extension"]
dependencies = [
    "hanzo-tools>=0.3.0",
    "mcp>=1.25.0",
    "pydantic>=2.12.5",
    "aiohttp>=3.9.0",
    "websockets>=12.0",
    "zap-mdns>=0.1.0",
]

[project.optional-dependencies]
playwright = [
    "playwright>=1.49.0",
]

[project.entry-points."hanzo.tools"]
browser = "hanzo_tools.browser:TOOLS"

[tool.setuptools.packages.find]
where = ["."]
include = ["hanzo_tools*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]
