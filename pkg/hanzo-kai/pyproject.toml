[project]
name = "hanzo-kai"
version = "0.1.0"
description = "Python client for Kai decisions on the Hanzo API: typed answers to choice, yes/no and score questions."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Hanzo AI", email = "dev@hanzo.ai" }]
keywords = ["hanzo", "kai", "decisions", "classification", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.10,<3",
]

[project.urls]
Homepage = "https://hanzo.ai"
Documentation = "https://docs.hanzo.ai/docs/kai"
Repository = "https://github.com/hanzoai/python-sdk"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hanzo_kai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
