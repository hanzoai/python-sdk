[project]
name = "hanzo-cli"
version = "0.2.3"
description = "Hanzo unified CLI — IAM, KMS, PaaS, S3, Deploy"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Hanzo AI", email = "dev@hanzo.ai" }]
keywords = ["hanzo", "cli", "iam", "devops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "httpx>=0.25.0",
    "pyjwt>=2.8.0",
    "hanzo-iam>=1.30.0",
    "hanzo-kms>=1.0.0",
    "hanzo-s3>=1.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

# No [project.scripts]. The `hanzo` command belongs to the `hanzo` package and
# to nothing else. Both packages used to declare `hanzo = ...`, and since
# `hanzo` DEPENDS on this one, the winner was decided by pip install order —
# a coin flip between a 56-command CLI and this 10-command one. hanzo-cli kept
# winning, so `pip install hanzo` silently produced a CLI with no `auth`,
# `chat`, `agent`, `cloud`, `dev` or `mcp` at all. This package remains
# importable (`python -m hanzo_cli`) and its groups are mounted by `hanzo`.

[project.urls]
Homepage = "https://hanzo.ai"
Repository = "https://github.com/hanzoai/python-sdk"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hanzo_cli"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]
