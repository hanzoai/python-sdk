[project]
name = "hanzo-research"
version = "0.2.0"
description = "File measurements to Hanzo's /v1/research and /v1/benchmark with their provenance: harness commit, model weights, host, device."
readme = "README.md"
license = "MIT"
authors = [{ name = "Hanzo AI", email = "dev@hanzo.ai" }]
requires-python = ">=3.10"
dependencies = []  # stdlib only (urllib): importable in any zero-dependency harness
keywords = ["hanzo", "research", "benchmark", "provenance", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.scripts]
hanzo-research = "hanzo_research.cli:main"

[project.urls]
Homepage = "https://hanzo.ai"
Documentation = "https://github.com/hanzoai/python-sdk/blob/main/docs/content/docs/research.mdx"
Repository = "https://github.com/hanzoai/python-sdk"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hanzo_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: reads api.hanzo.ai with no credential (run with -m integration)"]
addopts = "-m 'not integration'"
