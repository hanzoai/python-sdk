[project]
name = "hanzo-research"
version = "0.1.0"
description = "Hanzo Research SDK — record and query R&D evidence (experiments, attempts, diary artifacts) via /v1/research. Zero-config provenance auto-capture."
requires-python = ">=3.9"
dependencies = []  # stdlib only (urllib) — importable in any zero-dep harness

[project.urls]
Homepage = "https://hanzo.ai"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hanzo_research"]
