[project]
name = "hanzo-tools-cloud"
version = "0.1.0"
description = "The Hanzo Cloud surface, generated from the fleet's own typed operations"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Hanzo AI", email = "dev@hanzo.ai" }]
keywords = ["hanzo", "mcp", "cloud", "tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["httpx>=0.27"]

[project.entry-points."hanzo.tools"]
cloud = "hanzo_tools.cloud:TOOLS"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hanzo_tools"]

[tool.hatch.build.targets.wheel.force-include]
"hanzo_tools/cloud/catalog.json" = "hanzo_tools/cloud/catalog.json"
