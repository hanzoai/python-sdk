[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hanzo-tools-llm"
version = "0.2.1"
description = "Models through Hanzo as MCP tools: llm (Enso routing, the catalog, feedback) and kai_decide (Kai decisions)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Hanzo Industries Inc", email = "dev@hanzo.ai" }]
keywords = ["hanzo", "tools", "llm", "mcp", "ai"]
dependencies = [
    "hanzo-tools>=0.3.8",
    "httpx>=0.27.0",
    "mcp>=1.25.0",
]

[project.entry-points."hanzo.tools"]
llm = "hanzo_tools.llm:TOOLS"

[tool.setuptools.packages.find]
where = ["."]
include = ["hanzo_tools*"]
