[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hanzo-tools-team"
version = "0.1.1"
description = "Hanzo MCP tool for Team — workspaces, members, and invitations"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Hanzo AI", email = "dev@hanzo.ai" }]
keywords = ["hanzo", "mcp", "team", "workspace", "collaboration", "tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "hanzo-tools-core>=0.1.0",
    "hanzo-tools-auth>=0.1.0",
    "httpx>=0.27.0",
]

# No `hanzo.tools` entry point: this addresses the fleet by hand, and the fleet
# is reached by the unified `hanzo` tool, which filters by what cloud offers an
# agent. Registering here put `team` in a model's tool list beside it — two ways
# to one API, and the second one unfiltered. Still importable for a human at a
# CLI; it is the auto-registration that is withdrawn.

[tool.hatch.build.targets.wheel]
packages = ["hanzo_tools"]
